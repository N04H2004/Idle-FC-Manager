<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Idle FC Manager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: club-house on a striped turf; sticker-style panels with thick ink outlines and hard offset shadows; full-screen night overlays for booster openings and matches. Single deliberate cartoon look (no dark variant). */
:root{
  --ink:#1c1a33;
  --turf:#2fae4e;
  --turf2:#29a046;
  --paper:#ffffff;
  --paper2:#eef3fa;
  --sun:#ffd23f;
  --tomato:#ff5a4e;
  --sky:#3fc1ff;
  --muted:#5b6478;
  --night:#15122b;
  --c-common:#b9c4d0;
  --c-rare:#3b7ff5;
  --c-epic:#9b4dff;
  --c-leg:#f5b301;
  --display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  background:var(--turf) repeating-linear-gradient(90deg,var(--turf) 0 72px,var(--turf2) 72px 144px);
  color:var(--ink);font-family:var(--body);font-weight:700;font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 40px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--turf)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
.wrap{max-width:1000px;margin:18px auto 0;display:flex;flex-direction:column;gap:18px}

.panel{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:16px}
.panel h2{font-size:1.5rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sub{color:var(--muted);font-weight:700;font-size:.9rem}

.btn{border:3px solid var(--ink);border-radius:14px;background:var(--sun);padding:10px 16px;font-family:var(--display);font-size:1.05rem;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s;letter-spacing:.02em}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--ink)}
.btn.red{background:var(--tomato);color:#fff}
.btn.blue{background:var(--sky)}
.btn.white{background:var(--paper)}
.btn.big{font-size:1.35rem;padding:14px 26px}
.btn.sm{font-size:.9rem;padding:6px 10px;border-radius:10px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-top:12px;display:flex;flex-direction:column;gap:10px;max-width:1000px;margin:0 auto}
.hdr{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding:10px 14px}
.club{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 200px}
.crest{width:46px;height:46px;flex:none;border:3px solid var(--ink);border-radius:50% 50% 45% 45%/40% 40% 60% 60%;background:linear-gradient(90deg,var(--tomato) 0 50%,#fff 50%);display:grid;place-items:center;font-family:var(--display);font-size:1rem;color:var(--ink);text-shadow:0 0 3px #fff}
.club-name{font-family:var(--display);font-size:1.25rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl{flex:1 1 180px;min-width:150px}
.lvl-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.85rem}
.lvl-badge{font-family:var(--display);font-size:1.1rem}
.bar{height:14px;border:3px solid var(--ink);border-radius:10px;background:var(--paper2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),#7be0ff);border-right:3px solid var(--ink);transition:width .5s}
.coins{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:1.4rem;font-variant-numeric:tabular-nums;background:var(--paper2);border:3px solid var(--ink);border-radius:999px;padding:3px 14px 3px 5px}
.coin{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c4,var(--sun) 45%,#e09a00);border:3px solid var(--ink);display:inline-grid;place-items:center;font-size:.7rem;font-family:var(--display)}
.mute{border:3px solid var(--ink);border-radius:12px;background:var(--paper);padding:6px 10px;font-weight:900;font-size:.8rem}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media (max-width:760px){.wrap{margin-top:10px}body{padding-bottom:14px}.tab .lock{display:none!important}.hdr .sub{display:none}}
.tab{border:3px solid var(--ink);border-radius:14px;background:var(--paper);padding:9px 4px;font-family:var(--display);font-size:1.05rem;box-shadow:3px 3px 0 var(--ink);position:relative}
.tab.on{background:var(--sun);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.tab .lock{font-family:var(--body);font-size:.65rem;display:block;font-weight:900;color:var(--muted)}

/* Cards */
.card{--cw:140px;width:var(--cw);aspect-ratio:5/7;font-size:calc(var(--cw)*.1);position:relative;border:.22em solid var(--ink);border-radius:1.1em;box-shadow:.3em .3em 0 var(--ink);overflow:hidden;flex:none;user-select:none;background:linear-gradient(160deg,#f2f5f8,var(--c-common));color:var(--ink)}
.card::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 18%,rgba(255,255,255,.55),transparent 45%);pointer-events:none}
.card.r-rare{background:linear-gradient(160deg,#a9d0ff,var(--c-rare) 60%,#1d4fc0)}
.card.r-epic{background:linear-gradient(160deg,#e7c2ff,var(--c-epic) 60%,#5b1fb3)}
.card.r-legendary{background:linear-gradient(160deg,#fff4b0,var(--c-leg) 55%,#cf7400)}
.card.r-legendary .c-shine{position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.75) 50%,transparent 60%);animation:shine 2.8s infinite;z-index:3;pointer-events:none}
.card.r-epic .c-shine{position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 44%,rgba(255,255,255,.45) 50%,transparent 56%);animation:shine 3.6s infinite;z-index:3;pointer-events:none}
@keyframes shine{0%{transform:translateX(-60%)}60%,100%{transform:translateX(60%)}}
.c-top{position:absolute;left:.45em;top:.35em;display:flex;flex-direction:column;align-items:center;line-height:1;z-index:2}
.c-ovr{font-family:var(--display);font-size:2.5em;color:#fff;-webkit-text-stroke:.07em var(--ink);paint-order:stroke fill;text-shadow:.07em .07em 0 var(--ink)}
.c-pos{font-size:.8em;background:var(--ink);color:#fff;padding:.12em .45em;border-radius:.4em;margin-top:.15em;font-weight:900;letter-spacing:.05em}
.c-av{position:absolute;left:16%;right:2%;top:5%;height:60%;z-index:1}
.c-av svg{width:100%;height:100%;display:block}
.c-name{position:absolute;left:6%;right:6%;top:64%;z-index:2;background:#fff;border:.16em solid var(--ink);border-radius:.6em;text-align:center;font-family:var(--display);font-size:1.05em;padding:.12em .25em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-foot{position:absolute;left:8%;right:8%;bottom:6%;z-index:2;display:flex;justify-content:space-between;font-size:.7em;font-weight:900;text-transform:uppercase;letter-spacing:.06em}
.r-rare .c-foot,.r-epic .c-foot{color:#fff}
.c-tag{position:absolute;right:.35em;top:.35em;z-index:4;background:var(--tomato);color:#fff;border:.14em solid var(--ink);border-radius:.5em;font-size:.68em;font-weight:900;padding:.1em .35em;letter-spacing:.04em}

/* Club view */
.grid-club{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px}
@media (max-width:760px){.grid-club{grid-template-columns:1fr}}
.lineup{position:relative;height:100%;width:auto;max-width:100%;margin:0 auto;aspect-ratio:2/3;container-type:size;border:3px solid var(--ink);border-radius:18px;overflow:hidden;background:repeating-linear-gradient(180deg,#36b957 0 11%,#2ea64b 11% 22%)}
.lineup svg.marks{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute;transform:translate(-50%,-50%);border:none;background:none;padding:0;border-radius:14px}
.slot .card{--cw:clamp(40px,11.6cqh,104px)}
.slot{display:flex;flex-direction:column;align-items:center;gap:3px}
.slot-lab{background:var(--ink);color:#fff;font-weight:900;font-size:.72rem;letter-spacing:.06em;border-radius:6px;padding:1px 7px;border:2px solid #fff}
.slot-lab.ok{background:var(--sun);color:var(--ink);border-color:var(--ink)}
.slot.sel{animation:pulse .8s infinite}
.slot.sel .card,.slot.sel .empty{outline:4px solid var(--sun);outline-offset:3px}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.05)}}
.empty{width:clamp(40px,11.6cqh,104px);aspect-ratio:5/7;border:3px dashed #fff;border-radius:14px;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:.95rem;text-align:center;background:rgba(0,0,0,.12);line-height:1.1;padding:4px}
.empty b{font-size:2rem;display:block}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{border:3px solid var(--ink);border-radius:14px;padding:8px;text-align:center;background:var(--paper2)}
.stat b{display:block;font-family:var(--display);font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:900}
.stat.hl{background:var(--sun)}
.side{display:flex;flex-direction:column;gap:14px}
.rec{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center;font-variant-numeric:tabular-nums}
.rec div{background:var(--paper2);border-radius:10px;padding:6px 2px;border:2px solid var(--ink)}
.rec b{display:block;font-family:var(--display);font-size:1.3rem}
.rec span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.troph{display:flex;flex-wrap:wrap;gap:8px}
.trophy{border:2px solid var(--ink);border-radius:999px;padding:4px 10px 4px 6px;font-size:.85rem;display:flex;align-items:center;gap:6px;background:var(--paper2)}
.trophy i{width:18px;height:18px;border-radius:4px 4px 9px 9px;border:2px solid var(--ink);display:inline-block}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inp{border:3px solid var(--ink);border-radius:12px;padding:9px 12px;font:inherit;font-weight:800;min-width:0;flex:1 1 160px;background:#fff;color:var(--ink)}
.set-h{font-size:1rem;margin:14px 0 6px}
.keys{display:grid;grid-template-columns:1fr;gap:6px}
.krow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.9rem}
.kbtn{min-width:96px;border:2px solid var(--ink);border-radius:8px;background:var(--paper2);box-shadow:0 3px 0 var(--ink);padding:4px 10px;font-weight:900;font-size:.85rem}
.kbtn.wait{background:var(--sun);animation:pulse2 .8s infinite}
@keyframes pulse2{50%{transform:scale(1.04)}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.chip{border:2px solid var(--ink);border-radius:999px;padding:5px 12px;background:var(--paper);font-weight:900;font-size:.85rem}
.chip.on{background:var(--ink);color:#fff}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:14px 10px;justify-items:center}
.cgrid .card{--cw:112px;cursor:pointer;transition:transform .12s}
.cgrid .card:hover{transform:translateY(-4px) rotate(-1deg)}
.cgrid .card.dim{opacity:.35;filter:grayscale(.6)}
.cgrid .card.elig{outline:4px solid var(--sun);outline-offset:2px}
.hint{background:var(--sun);border:3px solid var(--ink);border-radius:12px;padding:8px 12px;font-size:.9rem;margin-top:10px}
.muted{color:var(--muted)}

/* Club one-screen */
.club2{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;min-height:0}
.team-p,.bench-p{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.team-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sel{border:3px solid var(--ink);border-radius:12px;padding:6px 10px;font:inherit;font-family:var(--display);font-size:1rem;background:var(--sun);color:var(--ink);cursor:pointer}
.mstats{display:flex;gap:6px;font-size:.75rem;font-weight:900;letter-spacing:.04em}
.mstats span{border:2px solid var(--ink);border-radius:8px;padding:2px 7px;background:var(--paper2)}
.mstats span.hl{background:var(--sun)}
.mstats b{font-family:var(--display);font-weight:400;font-size:1rem}
.lineup-wrap{flex:1;min-height:0;display:flex;justify-content:center}
.team-foot{font-size:.8rem;text-align:center}
.bench-p .hint{margin:0}
.fchips{margin:0}
.bench{flex:1;min-height:0;overflow:auto;align-content:start;padding:4px 4px 10px;grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
.bench .card{--cw:100px}
@media (max-width:760px){
  .club2{grid-template-columns:1fr;grid-template-rows:auto auto;gap:10px}
  .team-p{padding:10px}
  .bench-p{padding:10px;gap:6px}
  .bench{display:flex;overflow-x:auto;overflow-y:hidden;flex:none;gap:8px;padding-bottom:8px}
  .bench .card{--cw:64px}
  .bench-p .team-head h2{font-size:1.15rem}
  .bench-p .team-head .btn{display:none}
  .team-p .team-foot{display:none}
  .team-p .hint{font-size:.78rem;padding:4px 8px;margin:0}
  .team-p .hint .btn{padding:2px 8px;font-size:.75rem}
  .team-p{gap:6px}
  .lineup{aspect-ratio:5/6}
  .slot-lab{font-size:.62rem;padding:0 5px}
  .empty{width:clamp(34px,10.5cqh,66px);font-size:.65rem}
  .chip{padding:4px 10px;font-size:.78rem}
  .fchips{flex-wrap:nowrap;overflow-x:auto}
  .fchips .chip{flex:none}
  .tab{font-size:.78rem;padding:8px 2px}
}
.tok{position:relative;display:flex;flex-direction:column;align-items:center;width:clamp(44px,17cqh,78px)}
.tok-av{width:clamp(30px,10.5cqh,60px);aspect-ratio:1;border-radius:50%;border:3px solid var(--ink);overflow:hidden;background:linear-gradient(160deg,#f2f5f8,var(--c-common));box-shadow:2px 2px 0 var(--ink)}
.tok.r-rare .tok-av{background:linear-gradient(160deg,#a9d0ff,var(--c-rare))}
.tok.r-epic .tok-av{background:linear-gradient(160deg,#e7c2ff,var(--c-epic))}
.tok.r-legendary .tok-av{background:linear-gradient(160deg,#fff4b0,var(--c-leg))}
.tok-av svg{width:118%;height:118%;margin:-4% 0 0 -9%;display:block}
.tok-o{position:absolute;right:-4px;top:-4px;background:var(--ink);color:#fff;font-family:var(--display);font-weight:400;font-size:.8rem;border-radius:8px;padding:0 5px;border:2px solid #fff;line-height:1.3}
.tok-p{position:absolute;left:-6px;top:-4px;background:var(--tomato);color:#fff;font-style:normal;font-weight:900;font-size:.6rem;border-radius:6px;padding:0 4px;border:2px solid var(--ink)}
.tok-n{margin-top:2px;background:#fff;border:2px solid var(--ink);border-radius:6px;font-size:.62rem;font-weight:900;padding:0 4px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot-lab.hid{display:none}
.tok-n em{font-style:normal;background:var(--ink);color:#fff;border-radius:4px;padding:0 3px;margin-right:2px}
.tok-n em.ok{background:var(--sun);color:var(--ink)}
.slot.sel .tok-av{outline:4px solid var(--sun);outline-offset:2px}
/* Match list */
.opps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:14px}
.opp{border:3px solid var(--ink);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--paper2)}
.opp .diff{font-family:var(--display);font-size:1.1rem;padding:2px 10px;border:2px solid var(--ink);border-radius:999px;align-self:flex-start}
.opp h3{font-size:1.3rem;display:flex;align-items:center;gap:8px}
.jersey{width:22px;height:22px;border:3px solid var(--ink);border-radius:6px 6px 4px 4px;flex:none}
.kv{display:flex;justify-content:space-between;font-size:.9rem;font-variant-numeric:tabular-nums}
.kv b{font-family:var(--display);font-weight:400;font-size:1.05rem}

/* Cups */
.cups{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:14px}
.cup{border:3px solid var(--ink);border-radius:16px;padding:14px;background:var(--paper2);display:flex;flex-direction:column;gap:8px;position:relative}
.cup .cupicon{width:46px;height:46px;border:3px solid var(--ink);border-radius:8px 8px 22px 22px;position:relative}
.cup .cupicon::after{content:"";position:absolute;left:12px;right:12px;bottom:-10px;height:7px;background:var(--ink);border-radius:3px}
.cup.locked{opacity:.6}
.bracket-wrap{overflow-x:auto;margin-top:14px;padding-bottom:6px}
.bracket{display:grid;grid-template-columns:repeat(3,minmax(170px,1fr));gap:14px;min-width:540px}
.b-col{display:flex;flex-direction:column;justify-content:space-around;gap:10px}
.b-col h4{font-size:1rem;text-align:center;color:var(--muted)}
.bm{border:3px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff}
.bm div{display:flex;justify-content:space-between;gap:8px;padding:5px 9px;font-size:.85rem;font-variant-numeric:tabular-nums}
.bm div+div{border-top:2px solid var(--ink)}
.bm .me{background:#ffe1de}
.bm .w{font-weight:900}
.bm .l{color:var(--muted);text-decoration:line-through}
.bm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* Shop */
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:14px}
.prod{border:3px solid var(--ink);border-radius:18px;padding:16px;background:var(--paper2);display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.prod .mini{width:84px;height:122px}
.odds{list-style:none;padding:0;margin:6px 0 10px;display:flex;flex-direction:column;gap:4px;font-size:.85rem}
.odds li{display:flex;align-items:center;gap:8px}
.odds i{width:12px;height:12px;border:2px solid var(--ink);border-radius:3px}
.odds b{margin-left:auto;font-variant-numeric:tabular-nums}

/* Pack visual */
.pack{width:200px;height:290px;position:relative;cursor:pointer;filter:drop-shadow(6px 6px 0 var(--ink));transition:transform .2s}
.pack:hover{transform:rotate(-2deg) scale(1.03)}
.pack>div{position:absolute;left:0;right:0;border:3px solid var(--ink);background:var(--pk1)}
.pack-top{top:0;height:30px;border-radius:12px 12px 4px 4px;background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 4px,transparent 4px 9px)!important;background-color:var(--pk1)!important}
.pack-bot{bottom:0;height:30px;border-radius:4px 4px 12px 12px;background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 4px,transparent 4px 9px)!important;background-color:var(--pk2)!important}
.pack-body{top:27px;bottom:27px;background:linear-gradient(165deg,var(--pk1),var(--pk2))!important;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden;color:#fff}
.pack-body::before{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.5) 50%,transparent 58%);animation:shine 3s infinite}
.pk-normal{--pk1:#1fc89c;--pk2:#0b7f86}
.pk-rare,.pk-starter{--pk1:#4d8dff;--pk2:#8a3cff}
.pk-ball{width:70px;height:70px;border-radius:50%;border:3px solid var(--ink);background:#fff radial-gradient(circle at 50% 50%,var(--ink) 0 11px,transparent 12px);position:relative}
.pk-ball::before,.pk-ball::after{content:"";position:absolute;width:16px;height:16px;background:var(--ink);border-radius:4px}
.pk-ball::before{left:4px;top:12px;transform:rotate(20deg)}
.pk-ball::after{right:4px;top:12px;transform:rotate(-20deg)}
.pk-name{font-family:var(--display);font-size:2rem;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink)}
.pk-tag{background:var(--sun);color:var(--ink);border:3px solid var(--ink);border-radius:8px;font-family:var(--display);padding:2px 10px;transform:rotate(-4deg)}
.pk-count{font-size:.8rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
.mini.pack{transform:scale(.42);transform-origin:top left;width:200px;height:290px;filter:drop-shadow(4px 4px 0 var(--ink));pointer-events:none}
.mini-box{width:84px;height:122px;position:relative}
.pack.shaking{animation:shake .7s}
@keyframes shake{0%,100%{transform:none}15%{transform:rotate(-6deg)}30%{transform:rotate(6deg)}45%{transform:rotate(-8deg) scale(1.04)}60%{transform:rotate(8deg) scale(1.06)}80%{transform:rotate(-3deg) scale(1.08)}}
.pack.torn{pointer-events:none}
.pack.torn .pack-top{animation:tear .6s forwards}
.pack.torn .pack-body,.pack.torn .pack-bot{animation:drop .6s .12s forwards}
@keyframes tear{to{transform:translate(90px,-160px) rotate(38deg);opacity:0}}
@keyframes drop{to{transform:translateY(220px);opacity:0}}

/* Overlays */
.ov{position:fixed;inset:0;z-index:60;overflow:auto;background:radial-gradient(circle at 50% 35%,#3a2d80,var(--night) 70%);color:#fff;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pk-wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:900px;margin:0 auto;overflow:hidden}
.pk-title{font-family:var(--display);font-size:1.8rem;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink);color:var(--sun);margin-top:8px;text-align:center}
.stage{position:relative;min-height:380px;width:100%;display:grid;place-items:center;cursor:pointer}
.pk-hint{font-weight:900;font-size:1rem;margin:0;text-align:center;min-height:1.5em}
.tray{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:96px}
.tray .card{animation:pop .35s}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.flip{perspective:1100px;position:relative;z-index:2}
.flip-in{position:relative;transition:transform .45s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.flip.flipped .flip-in{transform:rotateY(180deg)}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{position:absolute;inset:0;transform:rotateY(180deg)}
.cb{border:5px solid var(--ink);border-radius:20px;aspect-ratio:5/7;background:var(--night) radial-gradient(circle at 50% 50%,#2c2560 0 30%,transparent 31%),repeating-linear-gradient(45deg,#231d4d 0 10px,#2b2459 10px 20px);display:grid;place-items:center;box-shadow:6px 6px 0 #000;transition:box-shadow .3s}
.cb span{font-family:var(--display);font-size:2.6rem;color:var(--sun);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.flip.tease .flip-in{animation:wig .14s infinite}
.flip.tease-epic .cb{box-shadow:0 0 40px 14px var(--c-epic),6px 6px 0 #000}
.flip.tease-legendary .cb{box-shadow:0 0 50px 22px var(--c-leg),6px 6px 0 #000}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg) scale(1.02)}75%{transform:rotate(3deg) scale(1.02)}}
.flip.flipped .flip-in{animation:none}
.rays{position:absolute;left:50%;top:50%;width:640px;height:640px;transform:translate(-50%,-50%);border-radius:50%;opacity:0;pointer-events:none;background:repeating-conic-gradient(var(--rc,#fff) 0 9deg,transparent 9deg 22deg);-webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%);transition:opacity .4s}
.rays.on{opacity:.75;animation:spin 9s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.rlabel{position:absolute;bottom:-6px;left:50%;transform:translate(-50%,100%);font-family:var(--display);font-size:1.4rem;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;white-space:nowrap;animation:pop .4s}
.sum{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;padding:10px 0}
.sum .card{animation:pop .4s backwards}
#flash{position:fixed;inset:0;background:#fff;z-index:80;opacity:0;pointer-events:none}
#flash.go{animation:flash .7s}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
#fx{position:fixed;inset:0;z-index:75;pointer-events:none;width:100%;height:100%}

/* Match */
.m-wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.m-score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:#0e0c1f;border:3px solid #000;border-radius:16px;padding:10px 12px;box-shadow:4px 4px 0 #000}
.m-team{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:1.05rem;min-width:0}
.m-team span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-team.r{justify-content:flex-end;text-align:right}
.m-team i{width:18px;height:18px;border:3px solid #fff;border-radius:5px;flex:none}
.m-mid{text-align:center}
.m-sc{font-family:var(--display);font-size:2.4rem;line-height:1;display:flex;gap:10px;justify-content:center;font-variant-numeric:tabular-nums;color:var(--sun)}
.m-min{font-weight:900;font-size:.9rem;background:var(--tomato);border-radius:999px;padding:1px 10px;display:inline-block;margin-top:4px;font-variant-numeric:tabular-nums}
.m-field{border:4px solid #000;border-radius:16px;overflow:hidden;box-shadow:5px 5px 0 #000}
.m-field canvas{display:block;width:100%;height:auto;aspect-ratio:5/3;background:#2ea64b}
.m-ctrl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.m-feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:190px;overflow:auto}
.m-feed li{background:rgba(255,255,255,.08);border-radius:10px;padding:7px 12px;font-size:.92rem;animation:pop .3s}
.m-feed li.goal{background:var(--sun);color:var(--ink);font-weight:900}
.m-end{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(10,8,25,.72);padding:16px}
.m-end .panel{color:var(--ink);text-align:center;max-width:380px;width:100%;display:flex;flex-direction:column;gap:10px;animation:pop .35s}
.m-end h2{font-size:2.4rem;justify-content:center}
.m-end .fs{font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.m-end ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.m-end li{background:var(--paper2);border:2px solid var(--ink);border-radius:10px;padding:6px}

/* 3D match */
.ov.g3{padding:0;background:#8fd8ff;overflow:hidden}
.g-root{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;color:#fff}
#g3c{position:absolute;inset:0;width:100%;height:100%;display:block}
.g-top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:min(560px,calc(100% - 24px))}
.g-sb{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;background:var(--ink);border:3px solid #fff;border-radius:14px;padding:5px 12px;width:100%;box-shadow:3px 3px 0 rgba(0,0,0,.35)}
.g-tn{display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:.95rem;min-width:0}
.g-tn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-tn.r{justify-content:flex-end;text-align:right}
.g-tn i{width:14px;height:14px;border:2px solid #fff;border-radius:4px;flex:none}
.g-sb b{font-family:var(--display);font-size:1.6rem;color:var(--sun);font-variant-numeric:tabular-nums;white-space:nowrap}
.g-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.g-radar{position:absolute;left:calc(env(safe-area-inset-left,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 12px);width:150px;height:90px;border:3px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 rgba(0,0,0,.3)}
@media (max-width:820px){.g-radar{top:calc(env(safe-area-inset-top,0px) + 96px);width:120px;height:72px}}
.g-cam{border:2px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);font-weight:800;font-size:.75rem;padding:2px 8px;display:inline-flex;align-items:center;gap:5px}
.g-cam .k{font-size:.6rem;border:2px solid var(--ink);border-radius:4px;padding:0 4px}
.g-clock{background:var(--tomato);border:3px solid var(--ink);border-radius:999px;padding:0 12px;font-weight:900;font-variant-numeric:tabular-nums}
.g-me{display:flex;align-items:center;gap:6px;background:rgba(28,26,51,.85);border-radius:999px;padding:3px 12px;font-weight:900;font-size:.8rem}
.g-bar{width:44px;height:7px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden;display:inline-block}
.g-bar i{display:block;height:100%;background:#7be37a;width:100%}
.g-bar.pow i{background:var(--sun);width:0}
.g-quit{border:2px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);font-weight:900;font-size:.75rem;padding:3px 10px}
.g-ban{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);font-family:var(--display);font-size:clamp(2.2rem,9vw,4.6rem);color:var(--sun);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink);opacity:0;transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1);pointer-events:none;text-align:center;max-width:94vw}
.g-ban.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.g-ban.small{font-size:clamp(1.4rem,5vw,2.4rem)}
.joy{position:absolute;left:calc(env(safe-area-inset-left,0px) + 20px);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:130px;height:130px;border-radius:50%;background:rgba(28,26,51,.35);border:3px solid rgba(255,255,255,.75);touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:var(--sun);border:3px solid var(--ink);pointer-events:none}
.gbtns{position:absolute;right:calc(env(safe-area-inset-right,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:grid;grid-template-columns:repeat(3,78px);gap:10px}
@media (max-width:520px){.gbtns{grid-template-columns:repeat(3,62px);gap:8px}.gb{width:62px;height:62px;font-size:.85rem}.gb-wide{width:100%}.joy{width:116px;height:116px}}
.gb{width:78px;height:78px;border-radius:50%;border:3px solid var(--ink);font-family:var(--display);font-size:1rem;box-shadow:3px 3px 0 var(--ink);touch-action:none;color:var(--ink);padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:transform .06s}
.gb .k,.g-move .k{font-family:var(--body);font-weight:900;font-size:.62rem;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:5px;padding:0 5px;line-height:1.35;box-shadow:0 2px 0 var(--ink);letter-spacing:.02em}
.g-move{position:absolute;left:calc(env(safe-area-inset-left,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;gap:5px;align-items:center;background:rgba(28,26,51,.82);border-radius:12px;padding:8px 12px;font-weight:900;font-size:.8rem}
.g-move .k{font-size:.75rem;padding:1px 7px}
.gb-a{background:var(--tomato);color:#fff}.gb-e{background:#c58bff}
.gb.off{opacity:.45}
.gb-wide{grid-column:span 2;width:100%;border-radius:40px}.gb-b{background:var(--sun)}.gb-c{background:var(--sky)}.gb-d{background:#fff}
.gb.held{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.g-keys{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);transform:translateX(-50%);background:rgba(28,26,51,.82);border-radius:10px;padding:6px 12px;font-size:.8rem;display:none;white-space:nowrap}
@media (hover:hover) and (pointer:fine){.joy{display:none}}
@media (hover:none),(pointer:coarse){.g-move{display:none}}
.g-help{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,8,25,.55);padding:16px;overflow:auto}
.g-help .panel{max-width:460px;width:100%;color:var(--ink);display:flex;flex-direction:column;gap:12px}
.g-tab{border-collapse:collapse;font-size:.88rem}
.g-tab td{padding:5px 6px;border-top:2px solid var(--paper2);vertical-align:top}
.g-tab td:first-child{font-family:var(--display);white-space:nowrap}

/* Welcome */
.welcome{max-width:620px;margin:40px auto 0;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
.logo{font-family:var(--display);font-size:clamp(2.6rem,10vw,4.4rem);line-height:.95;color:var(--sun);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:6px 6px 0 var(--ink);transform:rotate(-3deg)}
.logo small{display:block;font-size:.45em;color:#fff}
.welcome .panel{text-align:left;width:100%}
.welcome ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

/* Modal */
.modal{position:fixed;inset:0;z-index:55;background:rgba(10,8,25,.65);display:grid;place-items:center;padding:16px}
.modal .panel{max-width:420px;width:100%;display:flex;gap:16px;flex-wrap:wrap;justify-content:center;animation:pop .25s}
.modal .info{flex:1 1 170px;display:flex;flex-direction:column;gap:8px}
.modal .card{--cw:150px}

.toasts{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.toast{background:var(--ink);color:#fff;border:3px solid #fff;border-radius:14px;padding:10px 16px;font-weight:900;text-align:center;box-shadow:4px 4px 0 rgba(0,0,0,.4);animation:pop .3s}
.toast.gold{background:var(--sun);color:var(--ink);border-color:var(--ink)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media (max-width:520px){
  .tab{font-size:.9rem}
  .hdr{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 8px;padding:8px 10px}
  .hdr .lvl{grid-column:1/-1;order:5}
  .hdr .crest{width:36px;height:36px;font-size:.8rem}
  .hdr .club-name{font-size:1.05rem}
  .hdr .mute{padding:4px 6px;font-size:.7rem}
  .top{padding-top:8px;gap:8px}
  .coins{font-size:1.15rem}
  .prod{grid-template-columns:1fr}
}

/* ===== Manager ===== */
.hdr{gap:10px 14px}
.money{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:1.35rem;font-variant-numeric:tabular-nums;background:var(--paper2);border:3px solid var(--ink);border-radius:999px;padding:3px 14px 3px 5px;white-space:nowrap}

.cashbtn{display:grid;grid-template-columns:auto auto;gap:0 8px;align-items:center;border:3px solid var(--ink);border-radius:14px;background:#e9fbe9;padding:4px 10px;box-shadow:3px 3px 0 var(--ink);text-align:left;min-width:170px}

.nextbtn{white-space:nowrap}
.tabs.t6{grid-template-columns:repeat(6,1fr)}
.tab .badge,.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--tomato);color:#fff;font-family:var(--body);font-size:.72rem;font-weight:900;margin-left:6px;padding:0 5px;border:2px solid var(--ink);vertical-align:2px}
.eyebrow{font-size:.75rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

@media (max-width:620px){.dash{grid-template-columns:1fr}.dash .nm,.dash .inbox{grid-row:auto;grid-column:auto}}
.panel{display:flex;flex-direction:column;gap:10px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:4px 0}
.vs>div{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0}

.vs b{font-family:var(--display);font-weight:400;font-size:1.15rem;line-height:1.1}
.vs-x{font-family:var(--display);font-size:1.6rem;color:var(--tomato);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill}
.jersey.sm{width:14px;height:14px;display:inline-block;vertical-align:-2px;margin-right:6px;border-width:2px}
.pred{height:14px;border:3px solid var(--ink);border-radius:8px;background:#ffd6d2;overflow:hidden}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{border:2px solid var(--ink);border-radius:12px;padding:8px 10px;background:var(--paper2)}

.tbl{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}

.tscroll{overflow:auto;min-height:0;flex:1;border-radius:10px}
.pos{display:inline-block}
span.pos{font-weight:900;font-size:.72rem;border:2px solid var(--ink);border-radius:6px;padding:0 5px;color:var(--ink);background:#fff}
.p-GK{background:#ffd23f!important}.p-DEF{background:#a9d0ff!important}.p-MID{background:#b8f2c9!important}.p-ATT{background:#ffb3ac!important}

.tagv{font-size:.65rem;font-weight:900;background:var(--sun);border:2px solid var(--ink);border-radius:5px;padding:0 4px}
.cmp{font-size:.68rem;font-weight:900;margin-left:5px;border-radius:5px;padding:0 4px}

const PLAT={sdk:null,env:'none',paused:false};
async function platInit(){
  try{if(window.CrazyGames&&window.CrazyGames.SDK){await window.CrazyGames.SDK.init();PLAT.sdk=window.CrazyGames.SDK;PLAT.env=PLAT.sdk.environment||'none'}}catch(e){PLAT.sdk=null;PLAT.env='none'}

const sdkOK=()=>PLAT.sdk&&PLAT.env!=='disabled'&&PLAT.env!=='none';
function sdkCall(f){try{if(sdkOK())f(PLAT.sdk)}catch(e){}}
const STORE={
  get(k){try{if(sdkOK()&&PLAT.sdk.data){const v=PLAT.sdk.data.getItem(k);if(v!=null)return v}}catch(e){}try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{if(sdkOK()&&PLAT.sdk.data)PLAT.sdk.data.setItem(k,v)}catch(e){}try{localStorage.setItem(k,v)}catch(e){}},
  del(k){try{if(sdkOK()&&PLAT.sdk.data)PLAT.sdk.data.removeItem(k)}catch(e){}try{localStorage.removeItem(k)}catch(e){}}
};
/* langue : réglage > SDK > navigateur, anglais par défaut */
let LANG='en';
function pickLang(){
  const saved=STORE.get('ifc_lang');if(saved==='fr'||saved==='en')return saved;
  let loc='';try{loc=(PLAT.sdk&&PLAT.sdk.user&&PLAT.sdk.user.systemInfo&&PLAT.sdk.user.systemInfo.locale)||''}catch(e){}
  loc=loc||navigator.language||'en';return /^fr/i.test(loc)?'fr':'en';
}

}
function showAd(type,onReward){
  if(adBusy)return;adBusy=true;adPause();

}

  const spark=(n,col)=>{const sp=$('#sparks');if(!sp)return;for(let k=0;k<n;k++){const e=document.createElement('i'),a=Math.random()*Math.PI*2,d=90+Math.random()*140;
    e.style.cssText=`--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;--c:${col};--s:${4+Math.random()*7}px;animation-delay:${Math.random()*.08}s`;sp.appendChild(e);setTimeout(()=>e.remove(),900)}};
  const shake=(lvl)=>{ov.classList.remove('shk1','shk2');void ov.offsetWidth;ov.classList.add('shk'+lvl)};
  const act=()=>{
    if(phase==='sealed'&&!busy){busy=true;charge();return}
    if(phase==='tease'&&skipTo){const f=skipTo;skipTo=null;clear();f();return}
    if(phase==='shown'&&!busy)next();
  };
  stage.onclick=act;
  stage.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act()}};
  later(act,REDUCED?100:650);

  /* 1. le booster se charge : 3 secousses de plus en plus fortes */
  function charge(){
    const pack=$('#pack'),aura=$('#aura'),c=cards[0],big=RAR[c.rarity].order>=2,col=big?glowOf(c.rarity):'#ffffff';
    aura.style.setProperty('--ac',col);
    if(REDUCED){tearOpen();return}
    [0,1,2].forEach(k=>later(()=>{pack.classList.remove('jolt');void pack.offsetWidth;pack.style.setProperty('--j',(k+1));pack.classList.add('jolt');
      aura.className='aura a'+(k+1);spark(6+k*6,col);tone(200+k*120,.12,{type:'triangle',v:.06,to:260+k*160});if(k===2)shake(1)},k*420));
    later(tearOpen,1300);
  }
  /* 2. déchirure + la carte jaillit en tournant */
  function tearOpen(){
    const pack=$('#pack');pack.classList.add('torn');sfx.tear();flash();
    const c=cards[0];spark(26,glowOf(c.rarity));tone(90,.35,{type:'sine',v:.14,to:40});
    later(()=>{phase='card';showBack(true)},REDUCED?0:260);
  }
  function showBack(launch){
    const c=cards[i];
    stage.innerHTML=`<div class="rays" id="rays"></div><div class="aura a2" id="aura" style="--ac:${RAR[c.rarity].order>=1?glowOf(c.rarity):'#ffffff'}"></div><div class="shock" id="shock"></div>
      <div class="flip ${launch?'launch':''}" id="flip" style="width:${CW}px"><div class="tilt" id="tilt"><div class="flip-in" id="flipIn"><div class="face back"><div class="cb"><span>IFC</span></div></div><div class="face front">${cardHTML(c,{cw:CW})}<div class="holo"></div></div></div></div>
      <div class="hints" id="hints"></div><div id="rl"></div></div><div class="sparks" id="sparks"></div>`;
    hint.textContent=T('Touche pour retourner','Tap to flip');
    if(launch)tone(400,.5,{type:'sine',v:.05,to:1400});
    later(tease,REDUCED?0:launch?900:200);
  }
  /* 3. suspense selon la rareté (nationalité, poste…) */
  function tease(){
    const c=cards[i],ord=RAR[c.rarity].order,flip=$('#flip'),hints=$('#hints');phase='tease';skipTo=reveal;
    flip.classList.remove('launch');flip.classList.add('float');
    if(REDUCED||ord===0){later(reveal,REDUCED?0:250);return}
    flip.classList.add('glow','g-'+c.rarity);
    const steps=[];
    if(ord>=2)steps.push(`<span class="hchip">${c.nat}</span>`);
    if(ord>=2)steps.push(`<span class="hchip">${POSFULL[c.pos]}</span>`);
    if(ord>=3){ov.classList.add('dark')}
    let t=ord===1?350:250;
    steps.forEach((h,k)=>later(()=>{hints.insertAdjacentHTML('beforeend',h);tone(160+k*90,.25,{type:'square',v:.05,to:120+k*90});noise(.18,.08,0,300);shake(1);spark(10,glowOf(c.rarity))},t+k*750));
    t+=steps.length*750+(ord>=3?500:ord>=2?150:300);
    if(ord>=2)later(()=>{flip.classList.add('rumble');sfx.tease()},t-650);
    later(reveal,t);
  }
  /* 4. retournement : 2 tours et demi, onde de choc, rayons, compteur de note */
  function reveal(){
    skipTo=null;busy=true;phase='flipping';
    const c=cards[i],ord=RAR[c.rarity].order,flip=$('#flip'),fi=$('#flipIn');
    flip.classList.remove('rumble');ov.classList.remove('dark');
    fi.classList.add(REDUCED?'flipped':'spin');tone(300,.5,{type:'triangle',to:1200,v:.05});
    const ovr=flip.querySelector('.c-ovr');if(ovr&&!REDUCED)ovr.textContent=Math.max(30,c.ovr-25);
    later(()=>{
      effect(c);const sh=$('#shock');sh.style.setProperty('--sc',glowOf(c.rarity));sh.classList.add('go');
      flip.classList.add('land');if(ord>=2)shake(2);spark(ord>=2?50:24,glowOf(c.rarity));tone(70,.4,{type:'sine',v:.16,to:35});
      if(ovr&&!REDUCED){const from=Math.max(30,c.ovr-25),t0=performance.now();const up=now=>{const k=Math.min(1,(now-t0)/600),v=Math.round(from+(c.ovr-from)*k);if(ovr.textContent!=v){ovr.textContent=v;tone(600+v*6,.03,{type:'square',v:.02})}if(k<1)requestAnimationFrame(up)};requestAnimationFrame(up)}
      tiltOn();
      later(()=>{busy=false;if(cards.length===1){done1(c);return}phase='shown';hint.textContent=i<cards.length-1?'Touche pour la carte suivante':'Touche pour voir tout ton tirage'},500);
    },REDUCED?50:750);
  }
  function tiltOn(){
    const tl=$('#tilt');if(!tl||REDUCED)return;
    ov.onpointermove=e=>{const r=tl.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
      tl.style.transform=`rotateY(${clamp(x,-1,1)*22}deg) rotateX(${clamp(-y,-1,1)*18}deg)`;tl.style.setProperty('--hx',(50+x*80)+'%')};
    ov.onpointerleave=()=>{tl.style.transform=''};
  }
  function effect(c){
    const rays=$('#rays'),rl=$('#rl');
    rl.innerHTML=`<div class="rlabel" style="color:${RAR[c.rarity].color}">${RAR[c.rarity].label}${c.rarity==='legendary'?' !!!':c.rarity==='epic'?' !':''}</div>`;
    rays.style.setProperty('--rc',RAR[c.rarity].order?RAR[c.rarity].color:'#ffffff');rays.classList.add('on');if(!RAR[c.rarity].order)rays.classList.add('soft');
    if(c.rarity==='common'){sfx.common();confetti(20,['#fff','#b9c4d0']);return}
    sfx[c.rarity]();
    if(c.rarity==='rare')confetti(50,['#3b7ff5','#9cc2ff','#fff']);
    if(c.rarity==='epic')confetti(110,['#9b4dff','#e7c2ff','#fff','#3fc1ff']);
    if(c.rarity==='legendary'){flash();confetti(260,['#f5b301','#ffd23f','#fff','#ff5a4e','#3fc1ff']);setTimeout(()=>confetti(160,['#f5b301','#ffd23f','#fff']),600)}
  }
  function next(){
    tray.insertAdjacentHTML('beforeend',cardHTML(cards[i],{cw:64}));i++;
    if(i<cards.length){showBack(false);phase='card'}else summary();
  }
  function done1(c){
    phase='done';stage.onclick=null;stage.onkeydown=null;stage.style.cursor='default';
    hint.innerHTML=`<div style="display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:30px"><span>${esc(c.name)} · ${POSFULL[c.pos]} · note ${c.ovr}</span><button class="btn big" id="pkDone">Ajouter à mon club</button></div>`;
    $('#pkDone').onclick=()=>{sfx.click();ov.onpointermove=ov.onpointerleave=null;ov.className='ov';ov.hidden=true;ov.innerHTML='';document.body.style.overflow='';after&&after()};
    $('#pkDone').focus();
  }
  function summary(){
    phase='done';stage.onclick=null;stage.onkeydown=null;stage.style.cursor='default';stage.removeAttribute('role');
    tray.innerHTML='';
    const best=cards[cards.length-1];
    stage.innerHTML=`<div class="sum">${cards.map((c,k)=>cardHTML(c,{cw:Math.min(124,Math.floor((innerWidth-60)/3))}).replace('class="card','style="animation-delay:'+(k*.08)+'s" class="card')).join('')}</div>`;
    hint.innerHTML=`<div style="display:flex;flex-direction:column;gap:12px;align-items:center"><span>Meilleur tirage : ${esc(best.name)} (${best.ovr}, ${RAR[best.rarity].label})</span><button class="btn big" id="pkDone">Ajouter à mon club</button></div>`;
    $('#pkDone').onclick=()=>{sfx.click();ov.onpointermove=ov.onpointerleave=null;ov.className='ov';ov.hidden=true;ov.innerHTML='';document.body.style.overflow='';after&&after()};
    $('#pkDone').focus();
  }
  stage.focus();
}



/* ================= TOON FOOT TYCOON v2 : progression guidée ================= */
let muted=false;
const fmt=n=>{n=Math.floor(n);const a=Math.abs(n),s=n<0?'−':'';
  if(a>=1e12)return s+(a/1e12).toFixed(2).replace('.',DEC())+' T€';
  if(a>=1e9)return s+(a/1e9).toFixed(2).replace('.',DEC())+(LANG==='en'?' B€':' Md€');if(a>=1e6)return s+(a/1e6).toFixed(2).replace('.',DEC())+' M€';
  if(a>=1e4)return s+Math.floor(a/1e3)+' k€';if(a>=1e3)return s+(a/1e3).toFixed(1).replace('.',DEC())+' k€';return s+a+' €'};

const WEEKS=18,MATCH_EVERY=40;

/* ---- divisions, licences ---- */

const LINES_442={GK:1,DEF:4,MID:4,ATT:2};

/* ---- état ---- */
const KEY='toonfoot_tycoon_v3';
function fresh(){return {v:2,started:false,club:'FC Les Crampons',money:150,fans:300,div:0,season:1,week:1,
  players:[],nextId:1,upg:{boutique:1,stade:0,sponsors:0,resto:0,tv:0,coach:0,scout:0,marketing:0,academy:0,fitness:0,coffre:0},

  earned:0,played:0,wins:0,tut:{step:0,done:false},seen:{},queue:[],playTime:0}}
let state=fresh();
function save(){try{state.last=Date.now();STORE.set(KEY,JSON.stringify(state))}catch(e){}}

/* ---- prestige ---- */
const PERKS={
  money:{name:'Héritage financier',max:10,desc:l=>`+${l*10} % sur tous les revenus`,step:'+10 % de revenus'},
  start:{name:'Trésor de départ',max:5,desc:l=>l?`Départ avec ${fmt(150*Math.pow(6,l))} et boutique niveau ${1+l*2}`:'Départ standard',step:'Démarrage plus riche'},
  luck:{name:'Main chanceuse',max:5,desc:l=>`Légendaire : ${(0.6+l*.6).toFixed(1).replace('.',DEC())} % (Classique) · ${5+l*2} % (Rare)`,step:'+ de Légendaires'},
  wages:{name:'Négociateur',max:5,desc:l=>`Salaires −${l*8} %`,step:'−8 % de salaires'},
  academy:{name:'Académie éternelle',max:3,desc:l=>`+${l} place${l>1?'s':''} au centre de formation`,step:'+1 place au centre'},
  coach:{name:'Légende du banc',max:5,desc:l=>`+${l} à la note de l'équipe`,step:'+1 à la note'}
};
const pres=()=>state.pres||(state.pres={stars:0,count:0,perks:{},hall:[],legend:false});
const perk=k=>pres().perks[k]||0;
const perkCost=k=>perk(k)+1+Math.floor(perk(k)/2);
function applyPerks(){PACKS.normal.odds.legendary=0.6+perk('luck')*.6;PACKS.rare.odds.legendary=5+perk('luck')*2}
function starsGain(){return Math.max(3,Math.floor(Math.log10(Math.max(10,state.earned)))-3)+state.trophies.length}
const legendsOpen=()=>pres().count>=3;

/* ---- joueurs ---- */
const rarityOf=o=>o>=85?'legendary':o>=75?'epic':o>=65?'rare':'common';
const price=p=>Math.round(30*Math.pow(1.3,p.ovr-45)/10)*10+20;
const sellPrice=p=>Math.round(price(p)*.35/10)*10;
const randLook=()=>({skin:ri(0,SKIN.length-1),hair:ri(0,6),hc:ri(0,HAIRC.length-1),beard:Math.random()<.25,jersey:ri(0,JERSEY.length-1),brow:Math.random()<.5});
function mkPlayer(ovr,pos){
  pos=pos||pickW({GK:11,DG:9,DC:13,DD:9,MG:8,MC:13,MD:8,AG:8,AC:12,AD:8});
  return {id:state.nextId++,name:genName(),pos,ovr,rarity:rarityOf(ovr),nat:pick(NATS),num:pos==='GK'?pick([1,16,30]):ri(2,27),look:randLook()};
}
function genPlayer(rarity,pos){const r=RAR[rarity];const base=r.min+Math.floor(Math.pow(Math.random(),1.5)*(r.max-r.min+1));const p=mkPlayer(base,pos);p.rarity=rarity;return p}
const byId=id=>state.players.find(p=>p.id===id);

/* ---- centre de formation ---- */
const TRAIN=[3,6,10];
const trainGain=m=>Math.max(1,Math.round(m*(.4+state.upg.academy*.1)));
const trainingList=()=>state.players.filter(p=>p.tr);
const places=()=>state.upg.academy?state.upg.academy+perk('academy'):0;
const freePlaces=()=>places()-trainingList().length;
const available=()=>state.players.filter(p=>!p.tr).length;
function finishTraining(p,partial){const t=p.tr;const g=partial?Math.floor(t.gain*(t.total-t.left)/t.total):t.gain;
  const r0=p.rarity;p.ovr=Math.min(99,p.ovr+g);p.rarity=rarityOf(p.ovr);p.tr=null;
  log(`${shortName(p.name)} sort du centre de formation : +${g} (note ${p.ovr})`);
  if(typeof toast==='function'){if(r0!==p.rarity){toast(`${shortName(p.name)} devient ${RAR[p.rarity].label} !`,true)}else toast(`${shortName(p.name)} revient du centre : +${g}`,true)}
}

/* ---- forme & équipe ---- */
const fitOf=p=>p.fit==null?100:p.fit;
const fitPen=p=>{const f=fitOf(p);return f>=55?0:Math.ceil((55-f)/4)};
const cur=p=>p.ovr-fitPen(p);
const LKEYS=['GK','DEF','MID','ATT'];
const linePen=(p,k)=>lineOf(p.pos)===k?0:(k==='GK'||p.pos==='GK')?25:8;
function autoXI(){
  const used=new Set(),xi={GK:[],DEF:[],MID:[],ATT:[]};
  /* les joueurs épuisés (forme < 45 %) passent après les joueurs reposés de leur ligne : ils récupèrent sur le banc */
  const REST=45,tired=p=>fitOf(p)<REST;
  const sorted=state.players.filter(p=>!p.tr).sort((a,b)=>(tired(a)-tired(b))||cur(b)-cur(a));
  for(const k of LKEYS)for(const p of sorted){if(xi[k].length>=LINES_442[k])break;if(!used.has(p.id)&&lineOf(p.pos)===k){xi[k].push({p,eff:cur(p)});used.add(p.id)}}
  for(const k of LKEYS)for(const p of sorted){if(xi[k].length>=LINES_442[k])break;if(!used.has(p.id)){xi[k].push({p,eff:cur(p)-linePen(p,k),out:true});used.add(p.id)}}
  return xi;
}
/* compo manuelle : les postes choisis sont gardés, les trous (vendu, en stage) sont complétés automatiquement */
function bestXI(){
  if(!state.manual||!state.xi)return autoXI();
  const used=new Set(),xi={GK:[],DEF:[],MID:[],ATT:[]};
  for(const k of LKEYS){const arr=state.xi[k]||[];for(let i=0;i<LINES_442[k];i++){const p=byId(arr[i]);if(p&&!p.tr&&!used.has(p.id)){xi[k][i]={p,eff:cur(p)-linePen(p,k),out:!!linePen(p,k)};used.add(p.id)}else xi[k][i]=null}}
  const sorted=state.players.filter(p=>!p.tr&&!used.has(p.id)).sort((a,b)=>cur(b)-cur(a));
  for(const pass of [0,1])for(const k of LKEYS)for(let i=0;i<LINES_442[k];i++){if(xi[k][i])continue;
    const p=sorted.find(q=>!used.has(q.id)&&(pass||lineOf(q.pos)===k));if(p){xi[k][i]={p,eff:cur(p)-linePen(p,k),out:!!linePen(p,k),auto:true};used.add(p.id)}}
  for(const k of LKEYS)xi[k]=xi[k].filter(Boolean);
  return xi;
}
function setManual(on){
  if(on){const a=autoXI();state.xi={};for(const k of LKEYS)state.xi[k]=a[k].map(x=>x.p.id)}
  state.manual=on;selSlot=null;
}
function placeInSlot(k,i,id){
  if(!state.xi)setManual(true);
  const cur0=bestXI();for(const kk of LKEYS)state.xi[kk]=cur0[kk].map(x=>x.p.id);
  let from=null;for(const kk of LKEYS){const j=state.xi[kk].indexOf(id);if(j>=0)from=[kk,j]}
  const prev=state.xi[k][i];state.xi[k][i]=id;
  if(from&&!(from[0]===k&&from[1]===i))state.xi[from[0]][from[1]]=prev;
}
let selSlot=null;
function teamNote(){
  const xi=bestXI(),all=[...xi.GK,...xi.DEF,...xi.MID,...xi.ATT];
  const coach=state.upg.coach+perk('coach');
  if(all.length<11)return {note:0,base:0,coach,xi,missing:11-all.length};
  const base=Math.round(avg(all.map(x=>x.eff)));
  return {note:base+coach,base,coach,xi,missing:0};
}
const starterIds=()=>{const xi=bestXI();return new Set([...xi.GK,...xi.DEF,...xi.MID,...xi.ATT].map(x=>x.p.id))};

/* ---- économie ---- */
const capacity=()=>{const l=state.upg.stade;return 500+l*300+l*l*45};
const fansMult=()=>1+state.fans/8000;
const divMult=()=>DIVS[state.div].mult;
const tierMult=l=>(l>=10?1.5:1)*(l>=25?2:1);
const partAt=(k,l)=>UPG[k].inc*l*tierMult(l);
function incomeParts(){const o={};for(const k in UPG)if(UPG[k].group==='inc')o[k]=partAt(k,Math.min(state.upg[k],UPG[k].max));return o}
const baseIncome=()=>Object.values(incomeParts()).reduce((s,x)=>s+x,0);
const streakMult=()=>1+Math.min(state.streak||0,10)*.05;
const presMult=()=>1+perk('money')*.1;
const income=()=>baseIncome()*fansMult()*divMult()*streakMult()*presMult();
const DREF=[55,64,73,82,92];
const wW=p=>Math.pow(1.09,p.ovr-DREF[state.div]);
const wageSum=()=>state.players.reduce((s,p)=>s+wW(p),0);
const WCAP=.7,WK=.006;
const wageShare=()=>Math.min(WCAP,wageSum()*WK*(1-perk('wages')*.08));
const wages=()=>income()*wageShare();
const wageOf=p=>wages()*wW(p)/(wageSum()||1);
const wagePreview=p=>income()*Math.min(WCAP,(wageSum()+wW(p))*WK*(1-perk('wages')*.08))-wages();
const net=()=>income()-wages();
const growth=()=>Math.floor((Math.min(state.week,WEEKS)-1)*(state.div===0?.2:.35));
const botStr=t=>Math.min(97,t.str+growth());
const PRIZE_S={win:90,draw:30,loss:10};
const matchPrize=k=>Math.round(Math.max(DIVS[state.div].win*(k==='win'?1:k==='draw'?.33:.1),income()*PRIZE_S[k]));
const packPrice=t=>Math.round(PACKS[t].price*divMult()*Math.pow(1.3,(state.packs&&state.packs[t])||0)/10)*10;
const upgCost=k=>{const u=UPG[k],l=state.upg[k];return Math.round(u.base*Math.pow(u.g,u.group==='inc'?Math.max(0,l-(k==='boutique'?1:0)):l)/10)*10};
const offlineMax=()=>(2+state.upg.coffre)*3600;
function licenceStatus(){const L=DIVS[state.div].lic;if(!L)return null;return Object.entries(L).map(([k,v])=>({k,need:v,have:state.upg[k],ok:state.upg[k]>=v}))}
const licenceOk=()=>{const s=licenceStatus();return !s||s.every(x=>x.ok)};

/* ---- ligue ---- */
function makeFixtures(ids){const n=ids.length,arr=ids.slice(),rounds=[];
  for(let r=0;r<n-1;r++){const pairs=[];for(let i=0;i<n/2;i++){const h=arr[i],a=arr[n-1-i];pairs.push(r%2?[a,h]:[h,a])}rounds.push(pairs);arr.splice(1,0,arr.pop())}
  return rounds.concat(rounds.map(rd=>rd.map(([h,a])=>[a,h])))}
const LEGNAMES=['Les Immortels','Galaxie FC','Olympus United','Dynamo Titan','Real Phénix','Inter Dragons','Sporting Zeus','AC Météore','Atlético Comète'];
function setRivals(teams){
  const [a,b]=DIVS[state.div].str,me=teamNote().note||a,bots=teams.filter(t=>!t.me);
  bots.forEach(t=>{t.str=ri(a,b);t.rival=false});
  if(state.div>=4)return;
  shuffle(bots.slice()).slice(0,3).forEach((t,i)=>{t.str=clamp(Math.max(t.str,me+(state.div===0?[-1,-3,-5]:[1,-1,-3])[i]+ri(-1,1)),a,b+8);t.rival=true});
}
function newLeague(){
  const names=new Set([state.club]),teams=[{id:0,name:state.club,color:state.kit?state.kit.j1:'#ff5a4e',me:true}];
  const pool=state.div>=4?shuffle(LEGNAMES.slice()):null;
  while(teams.length<10){const nm=pool?pool.pop():pick(CLUBA)+' '+pick(CLUBB);if(names.has(nm))continue;names.add(nm);teams.push({id:teams.length,name:nm,color:pick(BOTCOL)})}
  setRivals(teams);
  const table={};teams.forEach(t=>table[t.id]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
  state.league={teams,table,fixtures:makeFixtures(shuffle(teams.map(t=>t.id))),results:[]};
}
function standings(){const T=state.league.table;return state.league.teams.map(t=>({...t,...T[t.id]})).sort((x,y)=>y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf||x.id-y.id)}
const myPos=()=>standings().findIndex(t=>t.id===0)+1;
function simMatch(A,B){let a=0,b=0;const pA=1/(1+Math.exp(-(A-B)/22));
  for(let m=1;m<=90;m++)if(Math.random()<.1){const side=Math.random()<pA?0:1;if(Math.random()<clamp(.26+((side?B-A:A-B))*.006,.12,.45)){side?b++:a++}}
  return {a,b}}
function nextOpp(){const fx=state.league.fixtures[Math.min(state.week,WEEKS)-1].find(p=>p.includes(0));const home=fx[0]===0;return {home,t:state.league.teams[home?fx[1]:fx[0]]}}
function winChance(){const tn=teamNote().note,o=nextOpp();return clamp(.4+(tn+(o.home?2:-2)-botStr(o.t))*.025,.04,.93)}
function promoRule(){
  if(state.div<3)return {up:true,text:'Les 2 premiers montent'+(DIVS[state.div].lic?' (avec la licence)':'')};
  if(state.div===3)return {up:legendsOpen(),text:legendsOpen()?'Les 2 premiers entrent en Ligue des Légendes':'Le champion débloque le prestige'};
  return {up:false,text:'Le champion remporte le jeu'};
}

function playMatch(silent){
  const tn=teamNote();if(tn.missing){if(!silent)toast(`Il te manque ${tn.missing} joueur${tn.missing>1?'s':''} pour jouer`);return null}
  const L=state.league,fx=L.fixtures[state.week-1],res=[];let my=null;
  for(const [h,a] of fx){
    const sA=(h===0?tn.note:botStr(L.teams[h])+ri(-2,2))+2,sB=a===0?tn.note:botStr(L.teams[a])+ri(-2,2);
    let r=simMatch(sA,sB);if(!state.tut.done&&(h===0||a===0)){const g=ri(2,3),o=ri(0,1);r=h===0?{a:g,b:o}:{a:o,b:g}}
    res.push({h,a,hg:r.a,ag:r.b});
    const th=L.table[h],ta=L.table[a];th.p++;ta.p++;th.gf+=r.a;th.ga+=r.b;ta.gf+=r.b;ta.ga+=r.a;
    if(r.a>r.b){th.w++;th.pts+=3;ta.l++}else if(r.a<r.b){ta.w++;ta.pts+=3;th.l++}else{th.d++;ta.d++;th.pts++;ta.pts++}
    if(h===0||a===0)my={home:h===0,opp:L.teams[h===0?a:h],gf:h===0?r.a:r.b,ga:h===0?r.b:r.a};
  }
  L.results.push(res);
  const win=my.gf>my.ga,draw=my.gf===my.ga;
  const prize=matchPrize(win?'win':draw?'draw':'loss');const st0=state.streak||0;state.streak=win?st0+1:draw?st0:0;
  const cap=capacity(),room=Math.max(0,cap-state.fans);
  let fansGain=win?Math.min(room,Math.round((cap*.06+20)*(1+state.upg.marketing*.2))):draw?Math.min(room,Math.round(cap*.015)):-Math.round(state.fans*.02);
  state.money+=prize;state.earned+=prize;state.fans=clamp(state.fans+fansGain,100,Math.max(cap,state.fans));
  state.played++;if(win)state.wins++;
  state.lastMatch={...my,prize,fansGain,full:win&&room===0,season:state.season,week:state.week,streak:state.streak};
  log(`${win?'Victoire':draw?'Nul':'Défaite'} ${my.gf}-${my.ga} contre ${my.opp.name} · +${fmt(prize)}`);
  const ids=new Set([...tn.xi.GK,...tn.xi.DEF,...tn.xi.MID,...tn.xi.ATT].map(x=>x.p.id)),fr=1-state.upg.fitness*.15;
  state.players.forEach(p=>{p.fit=ids.has(p.id)?Math.max(0,fitOf(p)-(p.pos==='GK'?4:9)*fr):Math.min(100,fitOf(p)+(p.tr?20:30))});
  trainingList().forEach(p=>{p.tr.left--;if(p.tr.left<=0)finishTraining(p)});
  state.week++;state.matchT=MATCH_EVERY;
  let season=null;if(state.week>WEEKS)season=seasonEnd();
  return {m:state.lastMatch,season};
}
function seasonEnd(){
  const st=standings(),pos=st.findIndex(t=>t.id===0)+1,lines=[],d0=state.div;let move=0,won=false;
  const bonus=Math.round(Math.max(DIVS[d0].win*(11-pos)*2,income()*60*(11-pos)/2));state.money+=bonus;state.earned+=bonus;
  lines.push(`Prime de fin de saison (${pos}e) : +${fmt(bonus)}`);
  if(pos===1){state.trophies.push({name:`Champion ${DIVS[d0].name}`,season:state.season});lines.push(`Champion de ${DIVS[d0].name} !`)}
  if(d0<3){
    if(pos<=2&&licenceOk()){move=1;lines.push(`Montée en ${DIVS[d0+1].name} : revenus ×${DIVS[d0+1].mult} et nouvelles fonctionnalités !`)}
    else if(pos<=2){lines.push(`Montée refusée : licence incomplète (${licenceStatus().filter(x=>!x.ok).map(x=>`${UPG[x.k].name} niv. ${x.need}`).join(', ')}).`);state.licFail=true}
    else lines.push('Tu restes dans la même division. Finis dans les 2 premiers pour monter.');
  }else if(d0===3){
    if(pos===1){state.canPrestige=true;lines.push('Le prestige est débloqué : tu peux refonder le club (onglet Améliorations).')}
    if(pos<=2&&legendsOpen()){move=1;lines.push('Qualifié pour la Ligue des Légendes !')}
  }else if(d0===4&&pos===1){won=true;pres().legend=true;state.canPrestige=true;lines.push('Tu as remporté la Ligue des Légendes. Le jeu est terminé !')}
  if(pos>=9&&d0>0&&d0<4){move=-1;lines.push(`Descente en ${DIVS[d0-1].name}`)}
  if(d0===4&&pos>=9){move=-1;lines.push('Retour en Ligue 1')}
  state.history.push({season:state.season,div:d0,pos});
  state.div=clamp(d0+move,0,4);state.season++;state.week=1;state.packs={};newLeague();refreshMarket();
  log(`Fin de saison : ${pos}e${move>0?' · montée !':move<0?' · descente':''}`);
  return {pos,lines,move,won,div:state.div,from:d0};
}

function refreshMarket(){
  const [a,b]=DIVS[state.div].str,n=8,sc=state.upg.scout*2;
  state.market=Array.from({length:n},()=>mkPlayer(clamp(ri(a-6,b+2)+sc,40,96)));state.marketT=120;
}

/* ================= boucle temps réel ================= */
let lastTick=Date.now(),view='club',G_MODAL=false;
function tick(){
  const now=Date.now(),dt=Math.min(5,(now-lastTick)/1000);lastTick=now;
  if(!state.started||PLAT.paused){lastTick=now;return}
  state.playTime=(state.playTime||0)+dt;
  const g=net()*dt;state.money=Math.max(0,state.money+g);if(g>0)state.earned+=g;
  const tutBusy=!state.tut.done;
  if(!tutBusy&&state.week<=WEEKS&&state.matchT>0)state.matchT=Math.max(0,state.matchT-dt);
  state.marketT-=dt;if(state.marketT<=0){refreshMarket();if(view==='recruit'&&!G_MODAL)render()}
  if(state.auto&&state.seen.auto&&state.matchT<=0&&!G_MODAL&&$('#packOv').hidden&&!tutBusy&&!TUT.active)doMatch();
  paint();tutPlace();
}
let saveT=0;
setInterval(()=>{tick();if(++saveT%5===0)save()},250);
function paint(){
  const m=$('#hMoney');if(m)m.textContent=fmt(state.money);
  const r=$('#hRate');if(r){const n=net();r.textContent='+'+fmtR(Math.max(0,n))+'/s'}
  document.querySelectorAll('[data-cost]').forEach(b=>{b.disabled=state.money<+b.dataset.cost||b.dataset.lock==='1'});
  const mt=$('#mTimer'),mb=$('#mBar'),pb=$('#playBtn');
  if(mt){const ready=state.matchT<=0;mt.textContent=!state.tut.done&&!ready?'Le match se prépare…':ready?'Le match est prêt !':`Prochain match dans ${Math.ceil(state.matchT)} s`;mb.style.width=Math.round((1-state.matchT/MATCH_EVERY)*100)+'%';pb.disabled=!ready;pb.classList.toggle('ready',ready)}
  const mk=$('#mkT');if(mk)mk.textContent=Math.ceil(Math.max(0,state.marketT))+' s';
  {const ap=$('#adPlay');if(ap)ap.hidden=!(state.tut.done&&state.matchT>3&&state.week<=WEEKS&&!state.auto)}
  const rb=$('#readyB');if(rb)rb.hidden=!(state.started&&state.tut.done&&state.matchT<=0&&state.week<=WEEKS&&!state.auto&&view!=='club');
}

function upgHTML(){

    if(!unlockedU(k))return `<div class="upc locked" data-tut="lock-${k}"><div class="inf-h"><b>${u.name}</b><span class="lockt">${DIVS[u.div].name}</span></div><p class="sub">${u.desc}</p><p class="sub">Se débloque en ${DIVS[u.div].name}.</p></div>`;
    let now='',nxt='',pay='';
    if(u.group==='inc'){const d=(partAt(k,l+1)-partAt(k,l))*m;now=l?`Rapporte <b>${fmtR(partAt(k,l)*m)}/s</b>${tierMult(l)>1?` <span class="tier">×${String(tierMult(l)).replace('.',DEC())}</span>`:''}`:'Pas encore construit';
      nxt=`+${fmtR(d)}/s${l+1===10||l+1===25?' · palier !':''}`;pay=`remboursé en ${fmtT(c/d)}`;
      if(k==='stade')pay+=` · capacité ${fmtN(capacity())} → ${fmtN(500+(l+1)*300+(l+1)*(l+1)*45)}`}
    else if(k==='coach'){now=`Note de l'équipe <b>+${l}</b>`;nxt='+1 à la note'}
    else if(k==='scout'){now=`Joueurs du marché <b>+${l*2}</b>`;nxt='+2 de note au marché'}
    else if(k==='fitness'){now=`Fatigue par match <b>−${l*15} %</b>`;nxt='−15 % de fatigue'}
    else if(k==='coffre'){now=`Hors ligne : <b>${2+l} h</b> à 50 %`;nxt='+1 h hors ligne'}
    else if(k==='academy'){now=l?`<b>${places()}</b> place${places()>1?'s':''} · 10 matchs = <b>+${trainGain(10)}</b>`:'Pas encore construit';nxt=l?'+1 place, stages plus efficaces':'Construire le centre'}
    else{now=`Supporters par victoire <b>+${l*20} %</b>`;nxt='+20 % de supporters'}

    ${mx?'<span class="sub">Niveau maximum</span>':`<button class="btn" data-act="upg" data-k="${k}" data-cost="${c}">${nxt} · ${fmt(c)}</button>${pay?`<span class="sub">${pay}</span>`:''}`}</div>`};
  return `<section class="panel"><h2>Revenus</h2><p class="sub">Chaque niveau ajoute des € par seconde (multipliés par tes supporters, ta division et ta série). Paliers : niveau 10 = ×1,5, niveau 25 = ×2.</p>

  <section class="panel"><h2>Sport et club</h2>
    <div class="upg">${Object.keys(UPG).filter(k=>UPG[k].group==='sport').map(card).join('')}</div></section>
  ${presHTML()}`;

/* ================= modales ================= */
function openModal(html,handler){const md=$('#modal');md.hidden=false;md.className='modal';G_MODAL=true;md.innerHTML=`<div class="panel mpanel" role="dialog">${html}</div>`;
  md.onclick=e=>{const b=e.target.closest('[data-m]');if(b)handler(b.dataset.m,b)};const f=md.querySelector('.btn');if(f)f.focus()}
function closeModal(){const md=$('#modal');md.hidden=true;md.innerHTML='';md.onclick=null;G_MODAL=false;setTimeout(nextFeature,350)}
function doMatch(){
  const r=playMatch();if(!r)return;save();
  track('match',r.m);if(r.season)track('season',r.season);
  if(!state.auto||r.season)return matchAnim(r.m,()=>afterMatch(r));
  afterMatch(r);
}
function afterMatch(r){
  const {m,season}=r,win=m.gf>m.ga,draw=m.gf===m.ga;
  if(win){sfx.coin();confetti(60,['#ffd23f','#ff5a4e','#fff'])}
  if(season&&season.move===1){flash();confetti(200,['#ffd23f','#ff5a4e','#fff','#3fc1ff']);sfx.legendary()}
  checkFeatures();
  if(season&&season.won)return victory();
  if(state.auto&&!season){render();toast(`${win?'Victoire':draw?'Nul':'Défaite'} ${m.gf}-${m.ga} contre ${m.opp.name} · +${fmt(m.prize)}`,win);nextFeature();return}
  render();
  openModal(`<div class="rep"><div class="eyebrow">Saison ${m.season} · Match ${m.week} · ${m.home?'Domicile':'Extérieur'}</div>
    <h2 class="res ${win?'w':draw?'d':'l'}">${win?'Victoire !':draw?'Match nul':'Défaite'}</h2>

  b.onclick=e=>{const t=e.target.closest('[data-t]');if(!t)return;if(t.dataset.t==='next')tutNext();if(t.dataset.t==='skip')tutEnd(true)};

function tutPlace(){
  if(!TUT.active)return;const s=tutCur();if(!s)return;
  const box=$('#tut');if(!box)return;
  const el=s.sel?document.querySelector(s.sel):null;TUT.el=el;
  const [t1,t2,t3,t4]=box.querySelectorAll('.tb'),ring=box.querySelector('.tring'),b=box.querySelector('.tbub');
  const W=innerWidth,H=innerHeight;
  if(!el){t1.style.cssText=`left:0;top:0;width:${W}px;height:${H}px`;[t2,t3,t4].forEach(x=>x.style.cssText='display:none');ring.style.display='none';
    const cw=Math.min(380,W-32);b.style.cssText=`left:${(W-cw)/2}px;top:16px;width:${cw}px;visibility:hidden`;const ch=b.offsetHeight;b.style.cssText=`left:${(W-cw)/2}px;top:${Math.max(16,(H-ch)/2)}px;width:${cw}px`;return}
  const hole=s.hole?document.querySelector(s.hole)||el:el;
  const r=el.getBoundingClientRect(),p=6,x=Math.max(0,r.left-p),y=Math.max(0,r.top-p),w=Math.min(W,r.right+p)-x,h=Math.min(H,r.bottom+p)-y;
  const blockAll=!s.wait;
  t1.style.cssText=`left:0;top:0;width:${W}px;height:${y}px`;
  t2.style.cssText=`left:0;top:${y+h}px;width:${W}px;height:${Math.max(0,H-y-h)}px`;
  t3.style.cssText=`left:0;top:${y}px;width:${x}px;height:${h}px`;
  t4.style.cssText=`left:${x+w}px;top:${y}px;width:${Math.max(0,W-x-w)}px;height:${h}px`;
  ring.style.cssText=`display:block;left:${x}px;top:${y}px;width:${w}px;height:${h}px;pointer-events:${blockAll?'auto':'none'}`;
  if(!blockAll&&hole!==el){const hr=hole.getBoundingClientRect();ring.style.pointerEvents='none'}
  const M=16,G=14,bw=Math.min(360,W-2*M);
  b.style.cssText=`left:${M}px;top:${M}px;width:${bw}px;visibility:hidden`;
  const bh=b.offsetHeight;let bx=clamp(x+w/2-bw/2,M,W-bw-M),by;
  if(y+h+G+bh<=H-M)by=y+h+G;
  else if(y-G-bh>=M)by=y-G-bh;
  else if(x+w+G+bw<=W-M){bx=x+w+G;by=clamp(y+h/2-bh/2,M,H-bh-M)}
  else if(x-G-bw>=M){bx=x-G-bw;by=clamp(y+h/2-bh/2,M,H-bh-M)}
  else{by=H-bh-M;if(s.hole){const hr=document.querySelector(s.hole);if(hr){const q=hr.getBoundingClientRect();if(q.bottom>by&&q.top<by+bh)by=q.top-G-bh>=M?q.top-G-bh:M;if(q.top<by+bh&&q.bottom>by)by=Math.min(H-bh-M,q.bottom+G)}}}
  b.style.cssText=`left:${bx}px;top:${clamp(by,M,Math.max(M,H-bh-M))}px;width:${bw}px`;
}

const PROG=[[48,52,55],[45,48,52],[41,45,48],[43,47,50]];
const mtof=m=>440*Math.pow(2,(m-69)/12);
function mnote(f,t,d,type,v,dest){const a=AC,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(dest);o.start(t);o.stop(t+d+.05)}

  if(!MUS.on||!AC||PLAT.paused)return;const spb=60/112/2;
  while(MUS.next<AC.currentTime+.25){
    const t=MUS.next,st=MUS.step,bar=Math.floor(st/8)%4,ch=PROG[bar],b=st%8;
    if(b===0||b===3||b===6)mnote(mtof(ch[0]-12),t,.32,'triangle',.22,MUSG);
    if(b===0||b===4)ch.forEach(n=>mnote(mtof(n+12),t,.5,'square',.025,MUSG));
    if(b%2===1)mhat(t,.05);
    if(b===2||b===5){const mel=[ch[2]+12,ch[1]+12,ch[0]+24][(st>>3)%3];mnote(mtof(mel),t,.22,'triangle',.06,MUSG)}
    MUS.next+=spb;MUS.step++;
  }

    for(const p of ps){cx.fillStyle='rgba(0,0,0,.18)';cx.beginPath();cx.ellipse(X(p.x)+r*.25,Y(p.y)+r*.85,r*.95,r*.45,0,0,7);cx.fill()}
    for(const p of ps){const x=X(p.x),y=Y(p.y);
      cx.fillStyle=p.gk?(p.side?'#2b2b2b':'#ffd23f'):(p.side?oppCol:myCol());cx.strokeStyle='#1c1a33';cx.lineWidth=Math.max(2,u*.4);
      cx.beginPath();cx.arc(x,y,r,0,7);cx.fill();cx.stroke();if(!p.side&&!p.gk){const k2=kit();if(k2.j2!==k2.j1){cx.strokeStyle=k2.j2;cx.lineWidth=Math.max(1.5,u*.35);cx.beginPath();cx.arc(x,y,r*.72,0,7);cx.stroke();cx.strokeStyle='#1c1a33'}}
      cx.fillStyle='#f1c27d';cx.beginPath();cx.arc(x,y-r*.15,r*.5,0,7);cx.fill();cx.lineWidth=Math.max(1.5,u*.25);cx.stroke()}
    // étiquette du porteur / buteur
    const tag=celebr&&celebr.p?celebr.p:carrier;
    if(tag&&tag.side===0&&tag.name){cx.font=`900 ${Math.max(11,u*2.6)}px Nunito,sans-serif`;const w=cx.measureText(tag.name).width+u*2.4,x=clamp(X(tag.x)-w/2,4,W-w-4),y=Y(tag.y)-r-u*5.2;
      cx.fillStyle='#fff';cx.strokeStyle='#1c1a33';cx.lineWidth=2;cx.beginPath();cx.roundRect(x,y,w,u*3.8,u*1.2);cx.fill();cx.stroke();cx.fillStyle='#1c1a33';cx.textBaseline='middle';cx.fillText(tag.name,x+u*1.2,y+u*1.95)}
    // ballon
    const bx=X(ball.x),by=Y(ball.y),bh=ball.h*u*2.2,br=u*1.15*(1+ball.h*.12);
    cx.fillStyle='rgba(0,0,0,.25)';cx.beginPath();cx.ellipse(bx,by+u*.6,br,br*.5,0,0,7);cx.fill();
    cx.fillStyle='#fff';cx.strokeStyle='#1c1a33';cx.lineWidth=Math.max(1.5,u*.35);cx.beginPath();cx.arc(bx,by-bh,br,0,7);cx.fill();cx.stroke();
    cx.fillStyle='#1c1a33';cx.beginPath();cx.arc(bx,by-bh,br*.38,0,7);cx.fill();
  };

  let bi=-1,bt=0,last=performance.now();
  const loop=now=>{
    if(fin)return;const dt=Math.min(.05,(now-last)/1000);last=now;
    if(bi<0||bt>=beats[bi].dur){if(bi>=0&&beats[bi].end)beats[bi].end();bi++;bt=0;if(bi>=beats.length){setTimeout(finish,600);draw();return}if(beats[bi].start)beats[bi].start()}
    const b=beats[bi];bt+=dt;const k=Math.min(1,bt/b.dur);if(b.tick)b.tick(k);
    $('#maC').textContent=Math.floor(b.ma+(b.mb-b.ma)*k)+"'";
    // le bloc suit le ballon
    const shift=(ball.x-50)*.35;
    for(const p of P){const involved=b.rx===p||carrier===p||(celebr&&celebr.side===p.side&&!p.gk&&p.role!=='DEF');
      if(!involved){p.tx=p.gk?p.bx+(ball.x-p.bx)*.05:p.bx+shift;if(!(p.gk&&b.shot))p.ty=p.gk?31+(ball.y-31)*.25:p.by+(ball.y-p.by)*.18}
      if(carrier===p){p.tx=ball.x-(p.side?-1:1)*1.2;p.ty=ball.y}
      const sp=involved||(p.gk&&b.shot)?7:3;p.x+=(p.tx-p.x)*Math.min(1,dt*sp);p.y+=(p.ty-p.y)*Math.min(1,dt*sp)}
    if(carrier&&!b.tick){ball.x+=(carrier.x+(carrier.side?-1:1)*1.2-ball.x)*Math.min(1,dt*10);ball.y+=(carrier.y-ball.y)*Math.min(1,dt*10)}
    netShake=Math.max(0,netShake-dt*.9);
    draw();requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}

function P(){const p=pres();if(!p.stats)p.stats={wins:0,bestStreak:0,bestGoals:0,bestDiv:0,l1Titles:0,legPulls:0,earned:0,fastL1:0,fastLeg:0};if(!p.ach)p.ach={};return p.stats}
function track(kind,x){
  if(!state.started)return;const s=P(),d=daily();
  const inc=(id,n)=>d.list.forEach(g=>{if(g.id===id)g.prog+=n});
  if(kind==='match'){inc('match',1);inc('goals',x.gf);if(x.gf>x.ga){inc('win',1);s.wins++}s.bestGoals=Math.max(s.bestGoals,x.gf);s.bestStreak=Math.max(s.bestStreak,state.streak||0);d.list.forEach(g=>{if(g.id==='streak')g.prog=Math.max(g.prog,state.streak||0)})}
  if(kind==='upg')inc('upg',1);
  if(kind==='sell')inc('sell',1);
  if(kind==='pack'){inc('pack',1);if(x&&x.rarity==='legendary')s.legPulls++}
  if(kind==='season'){s.bestDiv=Math.max(s.bestDiv,state.div);
    if(x.from===3&&x.pos===1){s.l1Titles++;const t=state.playTime||0;if(!s.fastL1||t<s.fastL1)s.fastL1=t}
    if(x.won){const t=state.playTime||0;if(!s.fastLeg||t<s.fastLeg)s.fastLeg=t}}
  checkAch();renderTop();
}

  const p=pres();const s0=P();s0.earned=Math.max(s0.earned,(s0.earnedBase||0)+state.earned);
  for(const a of ACH)if(!p.ach[a.id]&&a.ok()){p.ach[a.id]=Date.now();const r=Math.max(500,Math.round(income()*300/10)*10);state.money+=r;

  const crest=hasC?`<svg x="49" y="${n?31:28}" width="22" height="24" viewBox="0 0 100 110">${crestSVG(k).replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'')}</svg>`:'';
  return `<svg class="jsvg ${cls}" viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="${id}"><path d="${sh}"/></clipPath></defs>
    <g clip-path="url(#${id})">${(JPAT[k.jpat]||JPAT.plain)(k.j1,k.j2)}</g><path d="M42 6 Q50 15 58 6" fill="none" stroke="${k.j2===k.j1?'#1c1a33':k.j2}" stroke-width="5"/><path d="${sh}" fill="none" stroke="#1c1a33" stroke-width="5" stroke-linejoin="round"/>${crest}${stars}</svg>`;
}

/* bannières */
const BSHAPES={pennant:'M8 14 H112 V104 L60 146 L8 104Z',swallow:'M8 14 H112 V146 L60 116 L8 146Z',flag:'M8 14 H112 V134 H8Z',scallop:'M8 14 H112 V124 Q99 144 86 124 Q73 144 60 124 Q47 144 34 124 Q21 144 8 124Z'};
const BPAT={
  plain:(a,b)=>`<rect width="120" height="150" fill="${a}"/>`,
  stripes:(a,b)=>`<rect width="120" height="150" fill="${a}"/>${[20,48,76].map(x=>`<rect x="${x}" width="14" height="150" fill="${b}"/>`).join('')}`,
  hoops:(a,b)=>`<rect width="120" height="150" fill="${a}"/>${[84,112].map(y=>`<rect y="${y}" width="120" height="12" fill="${b}"/>`).join('')}`,
  diag:(a,b)=>`<rect width="120" height="150" fill="${a}"/><path d="M0 150 L120 30 L120 150Z" fill="${b}"/>`,
  halves:(a,b)=>`<rect width="120" height="150" fill="${a}"/><rect x="60" width="60" height="150" fill="${b}"/>`,
  border:(a,b)=>`<rect width="120" height="150" fill="${b}"/><path d="M18 22 H102 V96 L60 130 L18 96Z" fill="${a}"/>`,
  stars:(a,b)=>`<rect width="120" height="150" fill="${a}"/>${[[22,30],[98,30],[22,96],[98,96],[60,116]].map(([x,y])=>`<path transform="translate(${x} ${y}) scale(.55)" d="M0 -12 L3.5 -4 L12 -4 L5 1.5 L7.5 10 L0 5 L-7.5 10 L-5 1.5 L-12 -4 L-3.5 -4Z" fill="${b}"/>`).join('')}`
};
function bannerSVG(k,cls=''){
  k=Object.assign({},KDEF,k);const id='kb'+(++KID),sh=BSHAPES[k.bshape]||BSHAPES.pennant;
  return `<svg class="bansvg ${cls}" viewBox="0 0 120 150" aria-hidden="true"><defs><clipPath id="${id}"><path d="${sh}"/></clipPath></defs>
    <path d="${sh}" transform="translate(5 5)" fill="rgba(28,26,51,.25)"/>
    <g clip-path="url(#${id})">${(BPAT[k.bpat]||BPAT.plain)(k.b1,k.b2)}<rect y="14" width="120" height="7" fill="rgba(0,0,0,.18)"/></g>
    <path d="${sh}" fill="none" stroke="#1c1a33" stroke-width="5" stroke-linejoin="round"/>
    <rect x="2" y="7" width="116" height="9" rx="4.5" fill="#c98b4a" stroke="#1c1a33" stroke-width="3.5"/><circle cx="4" cy="11.5" r="5.5" fill="#ffd23f" stroke="#1c1a33" stroke-width="3"/><circle cx="116" cy="11.5" r="5.5" fill="#ffd23f" stroke="#1c1a33" stroke-width="3"/>
    <svg x="28" y="28" width="64" height="70" viewBox="0 0 100 110">${crestSVG(k).replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'')}</svg></svg>`;
}
const hashS=s=>{let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h};
function oppKit(t){
  const h=hashS(t.name||''),pk=(a,n)=>a[(h>>>n)%a.length],c=t.color||'#3fc1ff',c2=pk(['#ffffff','#1c1a33','#ffd23f'],3);
  return {shape:pk(Object.keys(SHAPES),1),pat:pk(Object.keys(CPAT),4),c1:c,c2,sym:pk(['ini','ini','ball','star','crown','bolt','paw'],7),
    ini:(t.name||'').split(/\s+/).map(w=>w[0]||'').join('').slice(0,3),bshape:pk(Object.keys(BSHAPES),10),bpat:pk(Object.keys(BPAT),13),b1:c,b2:c2,jpat:'plain',j1:c,j2:c2};
}
let KDRAFT=null;
function kitModal(){
  if(!KDRAFT)KDRAFT=kit();const d=KDRAFT;
  const opt=(key,val,inner,on)=>`<button class="kopt ${on?'on':''}" data-m="k" data-k="${key}" data-v="${val}">${inner}</button>`;
  const sw=(key,cur)=>`<div class="kcols">${KCOL.map(c=>`<button class="ksw ${c===cur?'on':''}" style="background:${c}" data-m="k" data-k="${key}" data-v="${c}" aria-label="${c}"></button>`).join('')}</div>`;
  openModal(`<div class="kitm"><h2>${T('Blason, maillot & bannière','Crest, kit & banner')}</h2>
   <div class="kgrid">
    <div class="kprev">${bannerSVG(d,'big')}${jerseySVG(d,'big')}<b>${esc(state.club)}</b>

    <div class="kctl">
      <h3>${T('Blason','Crest')}</h3>

      <div class="krow"><span>${T('Motif','Pattern')}</span><div class="kopts">${Object.keys(CPAT).map(s=>opt('pat',s,crestSVG({...d,pat:s,sym:'none'}),d.pat===s)).join('')}</div></div>
      <div class="krow"><span>${T('Symbole','Symbol')}</span><div class="kopts">${['ini',...Object.keys(SYM)].map(s=>opt('sym',s,crestSVG({...d,sym:s}),d.sym===s)).join('')}</div></div>
      <div class="krow"><span>${T('Initiales','Initials')}</span><input id="kIni" maxlength="3" value="${esc(clubIni(d))}" autocomplete="off"></div>
      <div class="krow"><span>${T('Couleur 1','Colour 1')}</span>${sw('c1',d.c1)}</div>
      <div class="krow"><span>${T('Couleur 2','Colour 2')}</span>${sw('c2',d.c2)}</div>
      <h3>${T('Maillot','Kit')}</h3>
      <div class="krow"><span>${T('Motif','Pattern')}</span><div class="kopts">${Object.keys(JPAT).map(s=>opt('jpat',s,jerseySVG({...d,jpat:s}),d.jpat===s)).join('')}</div></div>
      <div class="krow"><span>${T('Couleur 1','Colour 1')}</span>${sw('j1',d.j1)}</div>

      <div class="krow"><span>${T('Blason','Crest')}</span><div class="kopts">${opt('jcrest','1',jerseySVG({...d,jcrest:'1'}),d.jcrest==='1')}${opt('jcrest','0',jerseySVG({...d,jcrest:'0'}),d.jcrest!=='1')}</div></div>
      <div class="krow"><span>${T('Étoiles','Stars')}</span><div class="kstars">${d.stars?`<b>${'★'.repeat(Math.min(5,d.stars))}${d.stars>5?' +'+(d.stars-5):''}</b> ${T('1 étoile par prestige','1 star per prestige')}`:`<i>☆</i> ${T('Ta première étoile se débloque avec le prestige.','Your first star unlocks with prestige.')}`}</div></div>
      <h3>${T('Bannière','Banner')}</h3>
      <div class="krow"><span>${T('Forme','Shape')}</span><div class="kopts">${Object.keys(BSHAPES).map(s=>opt('bshape',s,bannerSVG({...d,bshape:s}),d.bshape===s)).join('')}</div></div>
      <div class="krow"><span>${T('Motif','Pattern')}</span><div class="kopts">${Object.keys(BPAT).map(s=>opt('bpat',s,bannerSVG({...d,bpat:s}),d.bpat===s)).join('')}</div></div>
      <div class="krow"><span>${T('Couleur 1','Colour 1')}</span>${sw('b1',d.b1)}</div>
      <div class="krow"><span>${T('Couleur 2','Colour 2')}</span>${sw('b2',d.b2)}</div>
    </div>
   </div>
   <div class="row mact eq"><button class="btn white" data-m="cancel">${T('Annuler','Cancel')}</button><button class="btn red" data-m="save">${T('Enregistrer','Save')}</button></div></div>`,(a,b)=>{
    const keepScroll=()=>{const p=$('.mpanel'),y=p?p.scrollTop:0;kitModal();const q=$('.mpanel');if(q)q.scrollTop=y};
    if(a==='k'){d[b.dataset.k]=b.dataset.v;sfx.click();keepScroll()}
    if(a==='rand'){const pk=o=>o[Math.floor(Math.random()*o.length)];Object.assign(d,{shape:pk(Object.keys(SHAPES)),pat:pk(Object.keys(CPAT)),sym:pk(['ini','ini',...Object.keys(SYM)]),jpat:pk(Object.keys(JPAT)),bshape:pk(Object.keys(BSHAPES)),bpat:pk(Object.keys(BPAT)),c1:pk(KCOL),j1:pk(KCOL),b1:pk(KCOL)});d.c2=pk(KCOL.filter(c=>c!==d.c1));d.j2=pk(KCOL.filter(c=>c!==d.j1));d.b2=pk(KCOL.filter(c=>c!==d.b1));sfx.click();keepScroll()}
    if(a==='cancel'){KDRAFT=null;closeModal()}
    if(a==='save'){state.kit=Object.assign({},d);delete state.kit.stars;if(state.league)state.league.teams[0].color=d.j1;KDRAFT=null;save();closeModal();render();sfx.coin();toast(T('Nouveau look enregistré !','New look saved!'),true)}
  });
  const inp=$('#kIni');if(inp)inp.oninput=()=>{d.ini=inp.value.replace(/[^A-Za-zÀ-ÿ0-9]/g,'').slice(0,3);const pv=$('.kprev .bansvg');if(pv)pv.outerHTML=bannerSVG(d,'big')};
}

/* les montants des primes rétrécissent s'ils ne tiennent pas dans leur case */
function fitPz(){const bs=[...document.querySelectorAll('.pz b')];if(!bs.length)return;const key=bs.map(b=>b.textContent).join('|')+innerWidth;if(bs[0].dataset.fit===key)return;
  bs.forEach(b=>b.style.fontSize='');let f=Math.min(...bs.map(b=>parseFloat(getComputedStyle(b).fontSize))),n=0;bs.forEach(b=>b.style.fontSize=f+'px');
  while(bs.some(b=>b.scrollWidth>b.clientWidth+1)&&f>9&&n<30){f-=.5;n++;bs.forEach(b=>b.style.fontSize=f+'px')}bs[0].dataset.fit=key}
setInterval(fitPz,400);
